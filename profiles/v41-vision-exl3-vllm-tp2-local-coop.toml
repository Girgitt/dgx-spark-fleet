id = "v41-vision-exl3-vllm-tp2-local-coop"
title = "DeepSeek V4.1 Flash Vision / EXL3 2.9bpw / vLLM / TP2 / local replica / cooperative MoE"
adapter = "mia_exl3"
source = "sources/v41-exl3-vllm"
topology = "tp2"
port = 8888
served_model = "DeepSeek-v4.1-Flash-EXL3"
env_example = ".env.example"
env_file = ".env"

[env]
LANGUAGE_MODEL_ONLY = "0"
WEIGHT_SYNC = "rsync"
NFS_SHARE = "0"
DSV41_EXL3_SERIAL_STREAMS = "1"
VLLM_DISABLE_SHARED_EXPERTS_STREAM = "1"
EXL3_FUSED_MOE = "1"
EXL3_TEMP_ROWS_FUSED = "8"
EXL3_FAT_KERNEL = "0"
EXL3_FAT_GROUPED = "1"
SPEC_METHOD = "dspark"
DSPARK_TOKENS = "3"
MAX_MODEL_LEN = "600000"
MAX_NUM_SEQS = "2"
MAX_NUM_BATCHED_TOKENS = "8192"
SKIP_PULL = "1"
SKIP_BUILD = "1"
SKIP_SHIP = "1"
SKIP_SYNC = "1"
